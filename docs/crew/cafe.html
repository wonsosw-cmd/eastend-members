<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f8a83">
<title>카페 승인 · 이스트엔드 크루</title>
<link rel="stylesheet" href="style.css">
<style>
  .brand-mark { background: var(--teal); }
  .code-input {
    font-size: 40px; font-weight: 800; text-align: center;
    letter-spacing: 12px; padding: 16px 10px 16px 22px;
    font-variant-numeric: tabular-nums;
  }
  .amount-input { font-size: 26px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chip {
    background: #fff; border: 1px solid var(--line); color: var(--navy);
    border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .chip:hover { border-color: var(--teal); color: var(--teal-dark); }
  .who {
    background: #e8f5f3; border: 1px solid #c9e6e2; border-radius: 13px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  .who-name { font-size: 18px; font-weight: 800; color: var(--teal-dark); }
  .who-sub { font-size: 12.5px; color: #3d7a75; margin-top: 2px; }
  .done-card { background: var(--teal); color: #fff; border-radius: 18px; padding: 26px 20px; text-align: center; }
  .done-card .big { font-size: 30px; font-weight: 800; margin: 6px 0; }
  .done-card .sub { font-size: 13.5px; opacity: .92; }
  .split { display: flex; gap: 10px; margin-top: 16px; }
  .split > div { flex: 1; background: rgba(255,255,255,.16); border-radius: 12px; padding: 12px; }
  .split .k { font-size: 11.5px; opacity: .85; }
  .split .v { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">✓</div>
      <div>
        <div class="brand-name">크루 사용권 승인</div>
        <div class="brand-sub" id="brandSub">이스트엔드 제휴 카페</div>
      </div>
    </div>
    <button class="btn-ghost btn-sm hidden" id="settingsBtn" type="button">설정</button>
  </div>

  <div class="msg" id="msg"></div>

  <!-- 최초 설정 -->
  <section id="setupView">
    <div class="card">
      <h2 class="card-title">카페 설정 (이 기기에 한 번만)</h2>
      <div class="field">
        <label for="token">카페 접속 코드</label>
        <input id="token" type="text" placeholder="관리자에게 받은 코드" autocomplete="off">
      </div>
      <div class="field">
        <label for="cafeSel">카페</label>
        <select id="cafeSel"><option value="">접속 코드를 먼저 입력해 주세요</option></select>
      </div>
      <div class="field">
        <label for="staff">담당자 이름 <span class="muted" style="font-weight:400">(선택)</span></label>
        <input id="staff" type="text" placeholder="예: 김바리" maxlength="20" autocomplete="off">
        <p class="hint">승인 기록에 남아요. 교대 때 바꿔주시면 됩니다.</p>
      </div>
      <button class="btn-teal" id="setupBtn" type="button">저장하고 시작</button>
    </div>
  </section>

  <!-- 승인 1단계: 코드 -->
  <section id="codeView" class="hidden">
    <div class="card">
      <h2 class="card-title">1단계 · 크루 화면의 4자리 코드</h2>
      <input id="code" class="code-input" type="tel" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
      <button class="btn-teal btn-lg" id="lookupBtn" type="button" style="margin-top:14px" disabled>확인</button>
    </div>
  </section>

  <!-- 승인 2단계: 금액 -->
  <section id="amountView" class="hidden">
    <div class="card">
      <div class="who">
        <div class="who-name" id="whoName">-</div>
        <div class="who-sub" id="whoSub"></div>
      </div>
      <h2 class="card-title">2단계 · 결제 금액</h2>
      <div class="field">
        <input id="amount" class="amount-input" type="tel" inputmode="numeric" placeholder="0" autocomplete="off">
        <div class="chips" id="chips"></div>
        <p class="hint" id="splitNote">금액을 입력하면 회사 지원액과 본인 부담액이 자동 계산돼요.</p>
      </div>
      <button class="btn-teal btn-lg" id="redeemBtn" type="button" disabled>승인하기</button>
      <button class="btn-ghost" id="backBtn" type="button" style="width:100%;margin-top:8px">뒤로</button>
    </div>
  </section>

  <!-- 완료 -->
  <section id="doneView" class="hidden">
    <div class="done-card">
      <div class="sub">승인 완료</div>
      <div class="big" id="doneName">-</div>
      <div class="sub" id="doneWhen"></div>
      <div class="split">
        <div><div class="k">회사 지원</div><div class="v" id="doneCompany">-</div></div>
        <div><div class="k">본인 결제</div><div class="v" id="doneSelf">-</div></div>
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <p class="hint" id="doneNote" style="margin:0 0 12px"></p>
      <button class="btn-teal" id="nextBtn" type="button">다음 손님 승인</button>
    </div>
  </section>

  <!-- 오늘 내역 -->
  <section id="todayCard" class="card hidden">
    <h2 class="card-title">오늘 승인 내역 <span id="todayCount" class="muted"></span></h2>
    <div id="todayList"><p class="hint">아직 승인한 건이 없어요.</p></div>
  </section>

  <footer>이스트엔드 크루 복지 · 문의는 영업마케팅실</footer>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
(function () {
  var A = window.CrewAPI;
  var $ = function (id) { return document.getElementById(id); };
  var msg = $("msg");

  var K_TOKEN = "crewCafeToken", K_CAFE = "crewCafeName", K_STAFF = "crewCafeStaff";
  var state = { token: "", cafe: "", staff: "", voucher: 15000, pending: null };

  function show(view) {
    ["setupView", "codeView", "amountView", "doneView"].forEach(function (v) {
      $(v).classList.toggle("hidden", v !== view);
    });
    var working = view !== "setupView";
    $("settingsBtn").classList.toggle("hidden", !working);
    $("todayCard").classList.toggle("hidden", !working);
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ── 설정 ───────────────────────────────
  async function loadCafes(token) {
    var r = await A.get({ action: "cafe_init", token: token, cafe: "" });
    if (r.result !== "ok") throw new Error(r.message === "unauthorized" ? "접속 코드가 올바르지 않아요" : r.message);
    return r;
  }

  $("token").addEventListener("change", async function () {
    var t = $("token").value.trim();
    if (!t) return;
    A.clearMsg(msg);
    try {
      var r = await loadCafes(t);
      var sel = $("cafeSel");
      sel.innerHTML = r.cafes.map(function (c) {
        return '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + "</option>";
      }).join("") || '<option value="">등록된 카페가 없어요 (관리자 화면에서 추가)</option>';
      var saved = localStorage.getItem(K_CAFE);
      if (saved && r.cafes.indexOf(saved) >= 0) sel.value = saved;
      state.voucher = r.voucherAmount;
    } catch (err) {
      A.showMsg(msg, err.message);
      $("cafeSel").innerHTML = '<option value="">접속 코드를 먼저 입력해 주세요</option>';
    }
  });

  $("setupBtn").addEventListener("click", async function () {
    var t = $("token").value.trim(), c = $("cafeSel").value, s = $("staff").value.trim();
    if (!t) { A.showMsg(msg, "접속 코드를 입력해 주세요"); return; }
    if (!c) { A.showMsg(msg, "카페를 선택해 주세요"); return; }
    try {
      await loadCafes(t);
    } catch (err) { A.showMsg(msg, err.message); return; }

    state.token = t; state.cafe = c; state.staff = s;
    localStorage.setItem(K_TOKEN, t);
    localStorage.setItem(K_CAFE, c);
    localStorage.setItem(K_STAFF, s);
    A.clearMsg(msg);
    startWork();
  });

  $("settingsBtn").addEventListener("click", function () {
    $("token").value = state.token;
    $("staff").value = state.staff;
    $("token").dispatchEvent(new Event("change"));
    A.clearMsg(msg);
    show("setupView");
  });

  function startWork() {
    $("brandSub").textContent = state.cafe + (state.staff ? " · " + state.staff : "");
    $("code").value = "";
    $("lookupBtn").disabled = true;
    show("codeView");
    $("code").focus();
    loadToday();
  }

  // ── 1단계: 코드 확인 ────────────────────
  $("code").addEventListener("input", function (e) {
    e.target.value = e.target.value.replace(/[^0-9]/g, "").slice(0, 4);
    $("lookupBtn").disabled = e.target.value.length !== 4;
    if (e.target.value.length === 4) $("lookupBtn").focus();
  });
  $("code").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !$("lookupBtn").disabled) $("lookupBtn").click();
  });

  $("lookupBtn").addEventListener("click", async function () {
    var btn = $("lookupBtn");
    btn.disabled = true; btn.textContent = "확인 중...";
    A.clearMsg(msg);
    try {
      var r = await A.post({ action: "cafe_lookup", token: state.token, code: $("code").value });
      if (r.result !== "ok") { A.showMsg(msg, r.message); return; }
      state.pending = r;
      state.voucher = r.voucherAmount;
      $("whoName").textContent = r.name + " 크루";
      $("whoSub").textContent = (r.dept ? r.dept + " · " : "") +
        "이번 달 " + r.monthUsed + "/" + r.monthLimit + "회 사용 · 1회 지원 " + A.won(r.voucherAmount);
      $("amount").value = "";
      $("redeemBtn").disabled = true;
      renderChips();
      updateSplit();
      show("amountView");
      $("amount").focus();
    } catch (err) {
      A.showMsg(msg, "연결에 실패했어요: " + err.message);
    } finally {
      btn.disabled = $("code").value.length !== 4; btn.textContent = "확인";
    }
  });

  // ── 2단계: 금액 ─────────────────────────
  function renderChips() {
    var v = state.voucher;
    var opts = [Math.round(v / 3), Math.round(v / 2), v].filter(function (n, i, a) { return n > 0 && a.indexOf(n) === i; });
    $("chips").innerHTML = opts.map(function (n) {
      return '<button class="chip" type="button" data-v="' + n + '">' + n.toLocaleString("ko-KR") + "원</button>";
    }).join("");
    Array.prototype.forEach.call($("chips").querySelectorAll(".chip"), function (b) {
      b.addEventListener("click", function () {
        $("amount").value = Number(b.dataset.v).toLocaleString("ko-KR");
        updateSplit();
      });
    });
  }

  function amountValue() {
    return Number(String($("amount").value).replace(/[^0-9]/g, "")) || 0;
  }

  function updateSplit() {
    var a = amountValue(), v = state.voucher;
    $("redeemBtn").disabled = !(a > 0);
    if (!a) {
      $("splitNote").textContent = "금액을 입력하면 회사 지원액과 본인 부담액이 자동 계산돼요.";
      $("redeemBtn").textContent = "승인하기";
      return;
    }
    var company = Math.min(a, v), self = Math.max(0, a - v);
    $("splitNote").innerHTML = self > 0
      ? "회사 지원 <strong>" + A.won(company) + "</strong> · 본인 결제 <strong style='color:#9c6113'>" + A.won(self) + "</strong>"
      : "전액 회사 지원 <strong>" + A.won(company) + "</strong> (본인 결제 없음)";
    $("redeemBtn").textContent = self > 0 ? "승인하기 (본인 " + A.won(self) + " 결제)" : "승인하기";
  }

  $("amount").addEventListener("input", function (e) {
    var n = Number(String(e.target.value).replace(/[^0-9]/g, "")) || 0;
    e.target.value = n ? n.toLocaleString("ko-KR") : "";
    updateSplit();
  });
  $("amount").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !$("redeemBtn").disabled) $("redeemBtn").click();
  });

  $("backBtn").addEventListener("click", function () { A.clearMsg(msg); startWork(); });

  $("redeemBtn").addEventListener("click", async function () {
    var btn = $("redeemBtn");
    var label = btn.textContent;
    btn.disabled = true; btn.textContent = "승인 중...";
    A.clearMsg(msg);
    try {
      var r = await A.post({
        action: "cafe_redeem", token: state.token,
        code: $("code").value, amount: amountValue(),
        cafe: state.cafe, staff: state.staff
      });
      if (r.result !== "ok") { A.showMsg(msg, r.message); return; }
      $("doneName").textContent = r.name + " 크루";
      $("doneWhen").textContent = state.cafe + " · " + A.fmtDateTime(r.usedAt);
      $("doneCompany").textContent = A.won(r.company);
      $("doneSelf").textContent = A.won(r.self);
      $("doneNote").textContent = r.self > 0
        ? "본인 부담 " + A.won(r.self) + "은 손님에게 직접 결제받아 주세요. (총 결제 " + A.won(r.amount) + ")"
        : "총 결제 " + A.won(r.amount) + " 전액이 회사 지원으로 처리됐어요.";
      show("doneView");
      loadToday();
    } catch (err) {
      A.showMsg(msg, "연결에 실패했어요: " + err.message);
    } finally {
      btn.disabled = false; btn.textContent = label;
    }
  });

  $("nextBtn").addEventListener("click", function () { A.clearMsg(msg); startWork(); });

  // ── 오늘 내역 ───────────────────────────
  async function loadToday() {
    try {
      var r = await A.get({ action: "cafe_init", token: state.token, cafe: state.cafe });
      if (r.result !== "ok") return;
      state.voucher = r.voucherAmount;
      var rows = r.today || [];
      $("todayCount").textContent = rows.length ? "· " + rows.length + "건 · 회사 지원 " +
        A.won(rows.reduce(function (s, u) { return s + u.company; }, 0)) : "";
      $("todayList").innerHTML = rows.length ? rows.map(function (u) {
        var self = u.self > 0 ? " · 본인 " + A.won(u.self) : "";
        return '<div class="list-item"><div><div class="list-main">' + escapeHtml(u.name) + '</div>' +
          '<div class="list-sub">' + A.fmtDateTime(u.usedAt) + '</div></div>' +
          '<div class="right"><div class="list-main mono">' + A.won(u.amount) + '</div>' +
          '<div class="list-sub mono">회사 ' + A.won(u.company) + self + '</div></div></div>';
      }).join("") : '<p class="hint">아직 승인한 건이 없어요.</p>';
    } catch (e) { /* 조용히 무시 */ }
  }

  // ── 시작 ────────────────────────────────
  var t = localStorage.getItem(K_TOKEN), c = localStorage.getItem(K_CAFE);
  state.staff = localStorage.getItem(K_STAFF) || "";
  if (t && c) {
    state.token = t; state.cafe = c;
    $("staff").value = state.staff;
    startWork();
  } else {
    show("setupView");
    var qp = new URLSearchParams(location.search);
    if (qp.get("t")) { $("token").value = qp.get("t"); $("token").dispatchEvent(new Event("change")); }
  }

  setInterval(function () { if (state.token && !document.hidden) loadToday(); }, 30000);
})();
</script>
</body>
</html>
